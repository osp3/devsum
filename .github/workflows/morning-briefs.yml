name: Morning briefs

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Retries cover the Render free-tier cold start
      - name: Start morning brief job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ vars.API_URL || 'https://api.devsum.xyz' }}
        run: |
          curl -fsS --retry 6 --retry-all-errors --retry-delay 20 --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/morning-briefs"
